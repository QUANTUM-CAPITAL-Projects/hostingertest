<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostinger Test Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #1f1f1f;
      padding: 24px;
    }
    .card {
      width: min(650px, 100%);
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.10);
    }
    h1 { color: #673de6; margin-bottom: 15px; }
    p { line-height: 1.6; margin-bottom: 20px; }
    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: #e9f9ee;
      color: #18753c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎉 Website is Live!</h1>
    <p>If you can see this page, your HTML website has been successfully hosted on Hostinger.</p>
    <span class="status">Hosting is working ✓</span>
  </main>
</body>
</html>
